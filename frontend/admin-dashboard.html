<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browniee | Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="admin-dashboard">
    <div class="auth-card">
      <h2>Admin Dashboard</h2>
      <p>Manage brownies, view customers, and track orders.</p>
      <button id="admin-logout" class="btn btn-secondary">Logout</button>
      <div id="admin-stats" class="stats-grid"></div>
      <form id="product-form" class="auth-form">
        <h3>Add Brownie</h3>
        <div class="field"><label for="product-name">Name</label><input id="product-name" required /></div>
        <div class="field"><label for="product-price">Price</label><input id="product-price" type="number" step="0.01" required /></div>
        <div class="field"><label for="product-category">Category</label><input id="product-category" required /></div>
        <div class="field"><label for="product-description">Description</label><input id="product-description" /></div>
        <div class="field"><label for="product-image">Image URL</label><input id="product-image" /></div>
        <div class="field"><label for="product-stock">Stock</label><input id="product-stock" type="number" /></div>
        <button class="btn btn-primary w-100" type="submit">Add Brownie</button>
      </form>
      <h3>Products</h3>
      <ul id="admin-products" class="summary-list"></ul>
      <h3>Users</h3>
      <ul id="admin-users" class="summary-list"></ul>
      <h3>Orders</h3>
      <ul id="admin-orders" class="summary-list"></ul>
    </div>
  </div>
  <script src="../script.js"></script>
</body>
</html>
