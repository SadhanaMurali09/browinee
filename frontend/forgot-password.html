<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browniee | Forgot Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <h2>Reset your password</h2>
      <p>Enter your email and we will email instructions.</p>
      <form id="forgot-form" class="auth-form">
        <div class="field">
          <label for="forgot-email">Email</label>
          <input id="forgot-email" type="email" placeholder="you@example.com" required />
        </div>
        <button class="btn btn-primary w-100" type="submit">Send Reset Link</button>
      </form>
      <p class="auth-switcher"><a href="auth.html">Back to login</a></p>
      <div id="forgot-message" class="auth-message"></div>
    </div>
  </div>
  <script src="../script.js"></script>
</body>
</html>
